name: ${APP_NAME}-${ENVIRONMENT}

services:
  laravel:
    image: ${DOCKER_REGISTRY}/${GITHUB_REPO}-laravel:${ENVIRONMENT}-latest
    restart: unless-stopped
    ports:
      - 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      start_interval: 5s
      start_period: 30s
      timeout: 5s
      interval: 5m
    env_file: .env
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"

      - "traefik.docker.network=traefik"
      - "traefik.http.services.${APP_NAME}-${ENVIRONMENT}-laravel.loadbalancer.server.port=8080"

      - "traefik.http.routers.insecure-${APP_NAME}-${ENVIRONMENT}-laravel.entrypoints=webinsecure"
      - "traefik.http.routers.insecure-${APP_NAME}-${ENVIRONMENT}-laravel.rule=Host(`${TRAEFIK_LARAVEL_HOST}`)"
      - "traefik.http.routers.insecure-${APP_NAME}-${ENVIRONMENT}-laravel.middlewares=redirectToHttps@file"

      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-laravel.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-laravel.rule=Host(`${TRAEFIK_LARAVEL_HOST}`)"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-laravel.tls=true"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-laravel.tls.certresolver=myresolver"

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    restart: unless-stopped
    networks:
      - default
      - traefik
    ports:
      - 9001
    volumes:
      - 'minio_data:/data'
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    labels:
      - "traefik.enable=true"

      - "traefik.docker.network=traefik"

      - "traefik.http.routers.insecure-${APP_NAME}-${ENVIRONMENT}-minio.entrypoints=webinsecure"
      - "traefik.http.routers.insecure-${APP_NAME}-${ENVIRONMENT}-minio.rule=Host(`${TRAEFIK_MINIO_HOST}`)"
      - "traefik.http.routers.insecure-${APP_NAME}-${ENVIRONMENT}-minio.middlewares=redirectToHttps@file"

      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-minio.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-minio.rule=Host(`${TRAEFIK_MINIO_HOST}`)"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-minio.tls=true"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-minio.tls.certresolver=myresolver"

  minio-createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio ${AWS_ENDPOINT} ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY};
      /usr/bin/mc mb myminio/public-bucket;
      /usr/bin/mc anonymous set public myminio/public-bucket;
      exit 0;
      "


  mariadb:
    image: mariadb:11.3.2
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: true
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: healthcheck.sh --su-mysql --connect --innodb_initialized
      interval: 10m

  redis:
    restart: unless-stopped
    image: redis:8.0
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10m
    command: ["redis-server", "--save 3600 10"]

  typesense:
    image: typesense/typesense:26.0
    restart: unless-stopped
    volumes:
      - typesense_data:/data
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors'

volumes:
  mariadb_data:
  minio_data:
  typesense_data:
  redis_data:

networks:
  traefik:
    external: true
    name: traefik
